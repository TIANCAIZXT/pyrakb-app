<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mini Wiki · 一个命令，一个文件夹，一个知识库（原型体验）</title>
<style>
  :root {
    --bg: #FFFFFF;
    --bg-soft: #FAFAFA;
    --bg-elevated: #FFFFFF;
    --border: #ECECEC;
    --border-strong: #E0E0E0;
    --text: #1A1A1A;
    --text-soft: #6B6B6B;
    --text-mute: #9A9A9A;
    --accent: #2E6BE6;
    --accent-soft: #EAF1FE;
    --accent-border: #C9DBFB;
    --danger: #D6453D;
    --danger-soft: #FBECEB;
    --shadow: 0 1px 2px rgba(0,0,0,0.04);
    --radius-btn: 10px;
    --radius-panel: 14px;
    --topbar-h: 56px;
    --sidebar-w: 250px;
    --measure: 820px;
    --ease: cubic-bezier(.4,0,.2,1);
    --bg-grad: linear-gradient(135deg, #eef2ff, #e9f7ff);
    --glass-top: rgba(255,255,255,.62);
    --glass-side: rgba(255,255,255,.55);
    --glass-main: rgba(255,255,255,.74);
    --glass-border: rgba(255,255,255,.6);
    --blob1: #6d9bff; --blob2: #46e0c8; --blob3: #b98cff; --blob4: #ffd36e;
  }
  [data-theme="dark"] {
    --bg: #18181A;
    --bg-soft: #1E1E21;
    --bg-elevated: #232327;
    --border: #2C2C30;
    --border-strong: #38383D;
    --text: #EDEDEF;
    --text-soft: #A8A8AD;
    --text-mute: #6E6E73;
    --accent: #5B8DF5;
    --accent-soft: #1E2A44;
    --accent-border: #36456B;
    --danger: #F0726B;
    --danger-soft: #3A2220;
    --shadow: 0 1px 2px rgba(0,0,0,0.3);
    --bg-grad: linear-gradient(135deg, #0e1422, #161d33);
    --glass-top: rgba(28,30,38,.6);
    --glass-side: rgba(28,30,38,.5);
    --glass-main: rgba(28,30,38,.8);
    --glass-border: rgba(255,255,255,.12);
    --blob1: #2a3f7a; --blob2: #1f5a52; --blob3: #4a3a73; --blob4: #6b5524;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg-grad);
    color: var(--text);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  /* 动态光斑背景 */
  .bg-blobs { position: fixed; inset: -20%; z-index: 0; pointer-events: none; overflow: hidden; }
  .bg-blobs .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .5; will-change: transform; }
  .bg-blobs .b1 { width: 46vw; height: 46vw; left: 2%; top: 4%; background: radial-gradient(circle, var(--blob1), transparent 70%); animation: mw-float1 16s ease-in-out infinite; }
  .bg-blobs .b2 { width: 42vw; height: 42vw; right: 0%; top: 14%; background: radial-gradient(circle, var(--blob2), transparent 70%); animation: mw-float2 19s ease-in-out infinite; }
  .bg-blobs .b3 { width: 40vw; height: 40vw; left: 24%; bottom: -6%; background: radial-gradient(circle, var(--blob3), transparent 70%); animation: mw-float3 22s ease-in-out infinite; }
  .bg-blobs .b4 { width: 34vw; height: 34vw; right: 18%; bottom: 2%; background: radial-gradient(circle, var(--blob4), transparent 70%); animation: mw-float4 25s ease-in-out infinite; }
  @keyframes mw-float1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(40px,30px) scale(1.12)} }
  @keyframes mw-float2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-36px,28px) scale(1.1)} }
  @keyframes mw-float3 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(30px,-28px) scale(1.15)} }
  @keyframes mw-float4 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-28px,-24px) scale(1.08)} }
  @media (prefers-reduced-motion: reduce) { .bg-blobs .blob { animation: none; } }

  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  ::selection { background: var(--accent-soft); }

  /* ===== Layout ===== */
  #app { display: flex; flex-direction: column; height: 100vh; position: relative; z-index: 1; }

  /* Top bar */
  #topbar {
    height: var(--topbar-h);
    flex: 0 0 var(--topbar-h);
    display: flex; align-items: center; gap: 18px;
    padding: 0 22px;
    background: var(--glass-top);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    backdrop-filter: blur(18px) saturate(160%);
    border-bottom: 1px solid var(--glass-border);
    z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 17px; letter-spacing: .2px; }
  .brand .logo {
    width: 30px; height: 30px; border-radius: 8px; overflow: hidden;
    display: grid; place-items: center; box-shadow: 0 4px 14px rgba(46,107,230,.28);
  }
  .brand .logo svg { display: block; }
  @keyframes mw-flap { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-15deg); } }
  .mw-flap { transform-box: fill-box; transform-origin: 50% 100%; animation: mw-flap 3.4s var(--ease) infinite; }
  .brand .brand-name { font-weight: 700; }
  .brand .sub { color: var(--text-mute); font-weight: 400; font-size: 12px; margin-left: 2px; }
  #search {
    flex: 1; max-width: 420px; margin: 0 auto;
    display: flex; align-items: center; gap: 8px;
    background: var(--bg-soft); border: 1px solid var(--border);
    border-radius: var(--radius-btn); padding: 8px 14px; color: var(--text-mute);
    transition: border-color .2s var(--ease);
  }
  #search:focus-within { border-color: var(--accent-border); }
  #search input { flex: 1; border: none; background: none; outline: none; color: var(--text); font-size: 14px; }
  #search .kbd { font-size: 11px; color: var(--text-mute); border: 1px solid var(--border-strong); border-radius: 5px; padding: 1px 6px; }
  .top-actions { display: flex; align-items: center; gap: 6px; }
  .seg { display: flex; background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius-btn); padding: 3px; }
  .seg button { padding: 6px 12px; border-radius: 8px; font-size: 13px; color: var(--text-soft); transition: all .2s var(--ease); }
  .doc-head-actions { display: flex; align-items: center; gap: 8px; }
  .act-sep { width: 1px; height: 22px; background: var(--border); margin: 0 2px; }
  .doc-act { font-size: 13px; padding: 6px 12px; border:1px solid var(--border); background: var(--bg-soft); color: var(--text-soft); border-radius:8px; cursor:pointer; white-space:nowrap; transition: all .2s var(--ease); }
  .doc-act:hover { background: var(--bg-elevated); color: var(--text); border-color: var(--border-strong); }
  .exp-wrap { position: relative; display:inline-block; }
  .export-menu { position:absolute; right:0; top:118%; background: var(--bg); border:1px solid var(--border); border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.18); z-index: 220; min-width:158px; overflow:hidden; }
  .export-menu button { display:block; width:100%; text-align:left; padding:10px 14px; border:none; background:transparent; color:var(--text); cursor:pointer; font-size:13px; }
  .export-menu button:hover { background: var(--accent-soft); color: var(--accent); }
  .seg button.active { background: var(--bg-elevated); color: var(--accent); box-shadow: var(--shadow); font-weight: 500; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: var(--radius-btn);
    display: grid; place-items: center; color: var(--text-soft);
    transition: background .2s var(--ease);
  }
  .icon-btn:hover { background: var(--bg-soft); color: var(--text); }

  .dl-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: var(--radius-btn);
    font-size: 13px; font-weight: 500; text-decoration: none; white-space: nowrap;
    color: var(--accent); background: var(--accent-soft);
    border: 1px solid var(--accent-border); transition: all .2s var(--ease);
  }
  .dl-badge:hover { background: var(--accent); color: #fff; }
  .dl-badge .ico { font-size: 14px; }
  .dl-badge .ver { font-variant-numeric: tabular-nums; }
  .dl-badge.update { box-shadow: 0 0 0 3px var(--accent-border); }

  /* Body */
  #body { flex: 1; display: flex; min-height: 0; }

  /* Sidebar */
  #sidebar {
    width: var(--sidebar-w); flex: 0 0 var(--sidebar-w);
    background: var(--glass-side);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    backdrop-filter: blur(18px) saturate(160%);
    border-right: 1px solid var(--glass-border);
    display: flex; flex-direction: column; min-height: 0;
  }
  .side-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 10px; }
  .side-title { font-size: 12px; font-weight: 600; letter-spacing: .6px; color: var(--text-mute); text-transform: uppercase; }
  .add-root {
    width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
    color: var(--accent); background: var(--accent-soft); font-size: 18px; transition: all .2s var(--ease);
  }
  .add-root:hover { background: var(--accent); color: #fff; }
  #tree, #taglist { flex: 1; overflow-y: auto; padding: 4px 10px 16px; }

  .node-row {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 8px; border-radius: 9px; cursor: pointer;
    font-size: 14px; color: var(--text); position: relative;
    transition: background .15s var(--ease);
  }
  .node-row:hover { background: var(--bg-elevated); }
  .node-row.selected { background: var(--accent-soft); color: var(--accent); font-weight: 500; box-shadow: inset 3px 0 0 0 var(--accent); }
  .node-row .twist { width: 14px; height: 14px; flex: 0 0 14px; color: var(--text-mute); transition: transform .2s var(--ease); display: grid; place-items: center; font-size: 10px; }
  .node-row.collapsed .twist { transform: rotate(-90deg); }
  .node-row .twist.leaf { visibility: hidden; }
  .node-row .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node-row .tagcount { font-size: 11px; color: var(--text-mute); }
  .node-row .row-add { opacity: 0; width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; color: var(--text-mute); font-size: 15px; }
  .node-row:hover .row-add { opacity: 1; }
  .node-row .row-add:hover { background: var(--accent-soft); color: var(--accent); }
  .node-row.drop-into { box-shadow: inset 0 0 0 2px var(--accent); background: var(--accent-soft); }
  .node-row.drop-into .label { color: var(--accent); font-weight: 500; }
  .node-row.drop-before { box-shadow: inset 0 2px 0 0 var(--accent); }
  .node-row.drop-after  { box-shadow: inset 0 -2px 0 0 var(--accent); }
  .node-row.drop-before .label, .node-row.drop-after .label { color: var(--accent); font-weight: 500; }
  .node-row.dragging { opacity: .35; }
  #tree.drop-root { box-shadow: inset 0 -3px 0 0 var(--accent); }
  /* 拖拽时跟随指针的幽灵标签 */
  .drag-ghost {
    position: fixed; top: 0; left: 0; z-index: 9999; pointer-events: none;
    padding: 4px 10px; border-radius: 8px; font-size: 13px; font-weight: 500;
    background: var(--accent); color: #fff; box-shadow: 0 6px 18px rgba(0,0,0,.25);
    transform: translate(-8px, -8px); max-width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* 拖拽进行中：禁止文本选择，避免原生选择干扰 */
  body.dragging-active { user-select: none; -webkit-user-select: none; cursor: grabbing; }
  body.dragging-active .node-row { cursor: grabbing; }
  .inline-input {
    flex: 1; border: 1px solid var(--accent); background: var(--bg-elevated);
    border-radius: 6px; padding: 3px 6px; font-size: 14px; outline: none; color: var(--text);
  }
  .children { margin-left: 14px; border-left: 1px solid var(--border); padding-left: 4px; }
  .children.hidden { display: none; }

  /* Tag list */
  .tag-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px; cursor: pointer; transition: background .15s; }
  .tag-item:hover { background: var(--bg-elevated); }
  .tag-item.active { background: var(--accent-soft); }
  .tag-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: 0 0 9px; }
  .tag-name { flex: 1; font-size: 14px; }
  .tag-cnt { font-size: 12px; color: var(--text-mute); }
  .tag-item .tag-del { opacity: 0; color: var(--text-mute); font-size: 13px; padding: 2px 5px; border-radius: 5px; }
  .tag-item:hover .tag-del { opacity: 1; }
  .tag-item .tag-del:hover { background: var(--danger-soft); color: var(--danger); }
  .tag-empty { padding: 24px 14px; color: var(--text-mute); font-size: 13px; text-align: center; }
  .filter-banner { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 4px 10px; padding: 7px 12px; background: var(--accent-soft); color: var(--accent); border-radius: 9px; font-size: 13px; }
  .filter-banner b { font-weight: 600; }
  .filter-banner .fcnt { font-style: normal; background: #fff; border: 1px solid var(--accent); border-radius: 999px; padding: 0 7px; font-size: 11px; margin-left: 2px; }
  .filter-banner .fclear { cursor: pointer; opacity: .8; }
  .filter-banner .fclear:hover { opacity: 1; text-decoration: underline; }
  .node-row.tag-hit > .label { color: var(--accent); font-weight: 600; }
  .node-row.tag-hit { box-shadow: inset 3px 0 0 var(--accent); }

  /* Main */
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--glass-main); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); }
  #editor-scroll { flex: 1; overflow-y: auto; }
  #editor-inner { max-width: var(--measure); margin: 0 auto; padding: 48px 32px 80px; }

  .empty-state { flex: 1; display: grid; place-items: center; color: var(--text-mute); }
  .empty-state .big { font-size: 22px; color: var(--text-soft); margin-bottom: 8px; font-weight: 500; }

  .doc-title {
    width: 100%; border: none; outline: none; background: none; color: var(--text);
    font-size: 30px; font-weight: 600; line-height: 1.3; margin-bottom: 6px;
  }
  .doc-title::placeholder { color: var(--text-mute); }

  /* 文档头：标题 + 标签（左） + 编辑/预览切换（右） */
  .doc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 6px; }
  .doc-head-main { flex: 1; min-width: 0; }
  .doc-head-actions { flex: 0 0 auto; padding-top: 6px; }

  .tagbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 14px 0 22px; min-height: 30px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent-soft); color: var(--accent);
    border: 1px solid var(--accent-border);
    border-radius: 999px; padding: 4px 10px; font-size: 13px;
    transition: all .15s var(--ease);
  }
  .chip .x { cursor: pointer; opacity: .7; font-size: 13px; line-height: 1; }
  .chip .x:hover { opacity: 1; }
  .tag-add { position: relative; }
  .tag-add input {
    border: 1px dashed var(--border-strong); background: var(--bg-soft);
    border-radius: 999px; padding: 4px 12px; font-size: 13px; outline: none; color: var(--text);
    width: 130px; transition: border-color .2s var(--ease);
  }
  .tag-add input:focus { border-color: var(--accent); border-style: solid; }
  .tag-pop {
    position: absolute; top: 36px; left: 0; z-index: 30;
    background: var(--bg-elevated); border: 1px solid var(--border-strong);
    border-radius: var(--radius-panel); box-shadow: 0 8px 30px rgba(0,0,0,.12);
    padding: 6px; min-width: 200px; max-height: 240px; overflow-y: auto;
  }
  .tag-pop .pop-item { padding: 7px 10px; border-radius: 8px; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; }
  .tag-pop .pop-item:hover { background: var(--bg-soft); }
  .tag-pop .pop-create { color: var(--accent); font-weight: 500; }

  /* 预览态：隐藏一切可编辑元素，呈现干净阅读视图（保留编辑/预览切换） */
  #editor-inner.mode-preview .fmt-group { display: none; }
  #editor-inner.mode-preview .tag-add { display: none; }
  #editor-inner.mode-preview .chip .x { display: none; }
  #editor-inner.mode-preview .doc-title { pointer-events: none; }
  #editor-inner.mode-preview .tagbar { margin: 10px 0 18px; }
  #editor-inner.mode-preview .toolbar { display: none; }

  .toolbar { display: flex; align-items: center; gap: 6px 4px; margin: 8px 0 12px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  .toolbar .fmt-group { display: flex; align-items: center; gap: 2px; }
  .toolbar button.fmt { border: 1px solid var(--border); background: var(--bg-soft); color: var(--text-soft); font-family: inherit; font-size: 12px; padding: 3px 6px; border-radius: 7px; cursor: pointer; line-height: 1; height: 26px; white-space: nowrap; }
  .toolbar button.fmt:hover { background: var(--bg-elevated); color: var(--text); border-color: var(--border-strong); }
  .toolbar button.fmt b { font-weight: 700; }
  .toolbar button.fmt i { font-style: italic; }
  .toolbar .fmt-sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }
  .toolbar .fmt-label { font-size: 13px; color: var(--text-mute); margin-right: 2px; }
  .preview table { border-collapse: collapse; margin: 14px 0; width: 100%; font-size: 15px; }
  .preview th, .preview td { border: 1px solid var(--border-strong); padding: 7px 12px; text-align: left; }
  .preview th { background: var(--bg-soft); font-weight: 600; }

  .editor-pane { font-size: 17px; line-height: 1.8; }
  textarea#md {
    width: 100%; min-height: 420px; border: none; outline: none; resize: vertical;
    background: none; color: var(--text); font-family: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 15px; line-height: 1.8;
  }
  .preview { font-size: 17px; line-height: 1.8; color: var(--text); }
  .preview h1 { font-size: 30px; font-weight: 600; margin: 28px 0 14px; }
  .preview h2 { font-size: 23px; font-weight: 600; margin: 24px 0 12px; }
  .preview h3 { font-size: 19px; font-weight: 600; margin: 20px 0 10px; }
  .preview p { margin: 14px 0; }
  .preview ul, .preview ol { margin: 14px 0; padding-left: 26px; }
  .preview li { margin: 6px 0; }
  .preview blockquote { border-left: 3px solid var(--accent); padding: 4px 16px; margin: 14px 0; color: var(--text-soft); background: var(--bg-soft); border-radius: 0 8px 8px 0; }
  .preview code { background: var(--bg-soft); padding: 2px 6px; border-radius: 6px; font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 14px; }
  .preview pre { background: var(--bg-soft); padding: 16px; border-radius: 10px; overflow-x: auto; margin: 14px 0; }
  .preview pre code { background: none; padding: 0; }
  .preview a { color: var(--accent); text-decoration: none; }
  .preview a:hover { text-decoration: underline; }
  .preview hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
  .preview .wikilink { color: var(--accent); border-bottom: 1px dashed var(--accent-border); cursor: pointer; }
  .preview .wikilink.missing { color: var(--text-mute); border-bottom: 1px dashed var(--text-mute); }
  .preview img.md-img { max-width: 100%; border-radius: 10px; margin: 14px 0; display: block; }
  .preview .img-missing { color: var(--text-mute); font-size: 13px; background: var(--bg-soft); border: 1px dashed var(--border-strong); padding: 4px 8px; border-radius: 6px; display: inline-block; }

  /* Status bar */
  #statusbar {
    flex: 0 0 34px; height: 34px; display: flex; align-items: center; gap: 16px;
    padding: 0 22px; border-top: 1px solid var(--border); background: var(--bg-soft);
    font-size: 12px; color: var(--text-mute);
  }
  #statusbar .saved { color: var(--accent); }

  /* Context menu */
  #ctxmenu {
    position: fixed; z-index: 100; min-width: 168px;
    background: var(--bg-elevated); border: 1px solid var(--border-strong);
    border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.18); padding: 6px;
    display: none;
  }
  #ctxmenu .mi { padding: 8px 12px; border-radius: 7px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
  #ctxmenu .mi:hover { background: var(--bg-soft); }
  #ctxmenu .mi.danger { color: var(--danger); }
  #ctxmenu .mi.danger:hover { background: var(--danger-soft); }
  #ctxmenu .sep { height: 1px; background: var(--border); margin: 5px 4px; }

  /* Modal */
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 90; display: none; align-items: center; justify-content: center; }
  .modal { background: var(--bg-elevated); border-radius: var(--radius-panel); padding: 26px; width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .modal h3 { font-size: 18px; margin-bottom: 10px; }
  .modal p { color: var(--text-soft); font-size: 14px; margin-bottom: 18px; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 10px; }
  /* 剪藏收录面板 */
  .clip-field { font-size: 12px; color: var(--text-soft); margin: 12px 0 5px; }
  .clip-input { width: 100%; box-sizing: border-box; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-soft); color: var(--text); font: inherit; font-size: 14px; }
  .clip-input:focus { outline: none; border-color: var(--accent); }
  #clip-preview { max-height: 170px; overflow: auto; font-size: 13px; line-height: 1.6; color: var(--text-soft); background: var(--bg-soft); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; word-break: break-word; }
  .btn { padding: 9px 18px; border-radius: var(--radius-btn); font-size: 14px; transition: all .15s var(--ease); }

  .btn.danger { background: var(--danger); color: #fff; }

  /* 导入预览 */

  .ip-card { width: min(560px, 94vw); max-height: 86vh; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 24px 70px rgba(20,30,60,.32); display: flex; flex-direction: column; overflow: hidden; }
  .ip-head { padding: 18px 20px 12px; border-bottom: 1px solid var(--border); }

  .ip-sub { font-size: 12px; color: var(--text-mute); margin-top: 4px; }

  /* Toast */
  #toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #1A1A1A; color: #fff; padding: 12px 18px; border-radius: 12px;
    font-size: 13px; display: flex; align-items: center; gap: 14px; z-index: 200;
    opacity: 0; pointer-events: none; transition: all .25s var(--ease); box-shadow: 0 10px 40px rgba(0,0,0,.3);
  }
  [data-theme="dark"] #toast { background: #EDEDEF; color: #1A1A1A; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  #toast .undo { color: #6FA0F5; font-weight: 600; cursor: pointer; }

  /* Graph */

  .g-node circle { cursor: pointer; transition: opacity .2s; }
  .g-node text { pointer-events: none; font-size: 12px; fill: var(--text); }
  .g-edge { transition: opacity .2s; }
  .g-legend {
    position: absolute; left: 22px; bottom: 22px; background: var(--bg-elevated);
    border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; font-size: 12px;
    box-shadow: var(--shadow);
  }
  .g-legend .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; color: var(--text-soft); }
  .g-legend .line { width: 22px; height: 0; border-top: 2px solid var(--accent); }
  .g-legend .line.dash { border-top: 2px dashed var(--text-mute); }

  .g-filter { position: absolute; left: 18px; top: 18px; display: flex; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 9px; padding: 3px; gap: 2px; z-index: 5; }
  .g-filter button { border: 0; background: transparent; color: var(--text-soft); font-size: 12px; padding: 5px 11px; border-radius: 6px; cursor: pointer; font-family: inherit; }
  .g-filter button.active { background: var(--accent); color: #fff; }

  /* 编辑器内 [[ ]] 联想下拉 */
  #link-pop { position: fixed; z-index: 120; background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: var(--radius-panel); box-shadow: 0 8px 30px rgba(0,0,0,.12); padding: 6px; min-width: 240px; max-height: 260px; overflow-y: auto; display: none; }

  #link-pop .pop-item:hover, #link-pop .pop-item.active { background: var(--bg-soft); }

  #link-pop .lp-empty { padding: 8px 10px; font-size: 12px; color: var(--text-mute); }

  /* 编辑器底部反向链接区 */
  .bl-section { margin-top: 44px; border-top: 1px solid var(--border); padding-top: 22px; }
  .bl-section h3 { font-size: 12px; color: var(--text-mute); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 14px; }
  .bl-section .bl-item { display: flex; flex-direction: column; gap: 5px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; cursor: pointer; transition: background .15s var(--ease); }
  .bl-section .bl-item:hover { background: var(--bg-soft); border-color: var(--border-strong); }

  .bl-section .bl-item .prev { font-size: 13px; color: var(--text-soft); line-height: 1.5; }

  ::-webkit-scrollbar-thumb:hover { background: var(--text-mute); }
</style>
</head>

<script>
/* ============ State & Storage ============ */
// Tauri 运行时（window.__TAURI__ / __TAURI_INTERNALS__）在 webview 初始化时注入，
// 可能晚于本脚本执行。因此检测必须延迟到注入完成（waitTauri），且 invoke 内部动态判定。
const TAURI_OK = () => !!(
  (window.__TAURI__ && ((window.__TAURI__.core && window.__TAURI__.core.invoke) || window.__TAURI__.invoke)) ||
  (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke)
);
let HAS_TAURI = false; // 在 boot 的 waitTauri 完成后置为真
const invoke = (cmd, args) => {
  if(!TAURI_OK()) return Promise.resolve();
  const T = window.__TAURI__;
  const fn = (T && T.core && T.core.invoke) || (T && T.invoke) || (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke);
  return fn ? fn(cmd, args) : Promise.resolve();
};
function waitTauri(){ return new Promise(res=>{ if(TAURI_OK()) return res(); let n=0; const iv=setInterval(()=>{ if(TAURI_OK()||++n>300){ clearInterval(iv); res(); } },10); }); }
const LS_KEY = 'pyrakb_v1';
function lsLoad(){ try{ const raw=localStorage.getItem(LS_KEY); if(!raw) return null; return JSON.parse(raw); }catch(e){ return null; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({ nodes:state.nodes, images:state.images, theme:state.theme })); }catch(e){ console.error('localStorage 写入失败（可能超出浏览器配额）', e); } }
let state = { nodes: {}, selectedId: null, view: 'tree', theme: 'light', filterTag: null, lastDeleted: null, graphFilter: 'all', images: {}, mode: 'edit' };

function uid(){ return 'n' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }

function seed(){
  const mk = (title, parentId, tags, content) => { const id = uid(); state.nodes[id] = { id, title, parentId, tags: tags||[], content: content||'' }; return id; };
  const p1 = mk('产品', null, ['产品'], '# 产品\n\n公司核心产品的规划与复盘。');
  const p1r = mk('调研', p1, ['调研'], '# 调研\n\n行业与竞品调研笔记。');
  mk('竞品分析', p1r, ['产品','调研'],
`# 竞品分析

对比几款主流工具的能力边界。

- [[Notion]]：全能但重
- [[Obsidian]]：本地优先、图谱强
- 见 [[产品规划]] 与上周 [[周报]]
- 关联 [[路线图]]

> 关键结论：本地优先是差异点。`);
  mk('产品规划', p1, ['产品'],
`# 产品规划

本期聚焦三件事，详见 [[竞品分析]]。

1. 目录树 CRUD
2. 标签体系
3. 关系图谱（见 [[路线图]]）`);
  const p2 = mk('工作', null, ['周报'], '');
  mk('周报', p2, ['周报'], '# 周报\n\n本周完成 [[竞品分析]] 初稿。');
  mk('路线图', p2, ['产品'], '# 路线图\n\n落地顺序参考 [[产品规划]]。');
  const p3 = mk('技术', null, ['技术'], '');
  mk('数据模型', p3, ['技术'], '# 数据模型\n\n节点=文件夹，正文=_content.md。\n\n（无链接，图谱中独立呈现。）');
  state.selectedId = p1r; // 竞品分析
  state.theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

function save(){ // 双模式：桌面走 Tauri 真实文件层；网页走浏览器本地存储
  if(HAS_TAURI){
    const nodes = Object.values(state.nodes).map(n=>({ id:n.id, title:n.title, parentId:n.parentId, tags:n.tags||[], content:n.content||'', order: n.order||0 }));
    invoke('sync_vault', { nodes, images: state.images, theme: state.theme }).catch(e=>console.error('sync_vault failed', e));
  } else {
    lsSave();
  }
}
async function apiLoad(){
  if(HAS_TAURI){
    try {
      const d = await invoke('load_vault');
      if(d && d.nodes && Object.keys(d.nodes).length){
        state.nodes = d.nodes;
        state.images = d.images || {};
        state.theme = d.theme || 'light';
        return true;
      }
    } catch(e){ console.error('load_vault failed', e); }
    // 文件层为空：尝试从旧版 localStorage 迁移（避免重装/升级丢数据）
    const ld = lsLoad();
    if(ld && ld.nodes && Object.keys(ld.nodes).length){
      state.nodes = ld.nodes;
      state.images = ld.images || {};
      state.theme = ld.theme || 'light';
      save(); // 写入文件层 ~/Documents/PyraKB
      showToast('已从本地缓存迁移历史笔记到文件库（~/Documents/PyraKB）');
      return true;
    }
    return false;
  } else {
    const d = lsLoad();
    if(d && d.nodes && Object.keys(d.nodes).length){
      state.nodes = d.nodes;
      state.images = d.images || {};
      state.theme = d.theme || 'light';
      return true;
    }
    return false;
  }
}

/* ============ Helpers ============ */
function roots(){ return Object.values(state.nodes).filter(n => n.parentId == null).sort((a,b)=>(a.order||0)-(b.order||0)); }
function childrenOf(id){ return Object.values(state.nodes).filter(n => n.parentId === id).sort((a,b)=>(a.order||0)-(b.order||0)); }
function getNode(id){ return state.nodes[id]; }
function levelOf(id){ let l=1, n=getNode(id); while(n && n.parentId){ l++; n=getNode(n.parentId); } return l; }
function titleToId(title){ const t=title.trim().toLowerCase(); const f=Object.values(state.nodes).find(n=>n.title.trim().toLowerCase()===t); return f?f.id:null; }
function allTags(){ const s=new Set(); Object.values(state.nodes).forEach(n=>n.tags.forEach(t=>s.add(t))); return [...s].sort(); }
function parseLinks(content){ const re=/\[\[([^\]]+)\]\]/g; const out=[]; let m; while((m=re.exec(content))){ out.push(m[1].trim()); } return [...new Set(out)]; }
function backlinksOf(id){ const t=getNode(id).title.trim().toLowerCase(); const res=[]; Object.values(state.nodes).forEach(n=>{ if(n.id===id) return; const ls=parseLinks(n.content); if(ls.some(l=>l.trim().toLowerCase()===t)) res.push(n); }); return res; }
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ============ 导出 / 复制 / 本地文件夹 ============ */
function downloadBlob(blob, filename){
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 120);
}
function nodeAsMarkdown(node){
  let md=(node.content||'');
  const fl=md.split('\n',1)[0]||'';
  const mh=fl.match(/^#\s+(.+?)\s*$/);
  if(!(mh && mh[1].trim()===(node.title||'').trim())) md='# '+(node.title||'未命名')+'\n\n'+md;
  return md.trim()+'\n';
}
function exportNote(fmt, node){
  if(!node) return;
  const title=(node.title||'未命名').replace(/[\\/:*?"<>|]/g,'_');
  const md=nodeAsMarkdown(node);
  if(fmt==='md'){
    if(HAS_TAURI){ invoke('export_note',{ filename: title+'.md', contents: md }).then(p=>{ showToast('已导出 Markdown → '+p); invoke('reveal_vault').catch(()=>{}); }).catch(()=>{ downloadBlob(new Blob([md],{type:'text/markdown;charset=utf-8'}), title+'.md'); showToast('已导出 Markdown'); }); }
    else { downloadBlob(new Blob([md],{type:'text/markdown;charset=utf-8'}), title+'.md'); showToast('已导出 Markdown'); }
  } else if(fmt==='doc'){
    const html=mdToHtml(md);
    const doc='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>'+escapeHtml(node.title||'未命名')+'</title></head><body>'+html+'</body></html>';
    if(HAS_TAURI){ invoke('export_note',{ filename: title+'.doc', contents: doc }).then(p=>{ showToast('已导出 Word → '+p); invoke('reveal_vault').catch(()=>{}); }).catch(()=>{ downloadBlob(new Blob([doc],{type:'application/msword'}), title+'.doc'); showToast('已导出 Word（.doc，含图片与格式）'); }); }
    else { downloadBlob(new Blob([doc],{type:'application/msword'}), title+'.doc'); showToast('已导出 Word（.doc，含图片与格式）'); }
  } else if(fmt==='pdf'){
    const html=mdToHtml(md);
    const w=window.open('','_blank');
    if(!w){ showToast('浏览器拦截了弹窗，请允许后重试'); return; }
    w.document.write('<html><head><meta charset="utf-8"><title>'+escapeHtml(node.title||'未命名')+'</title>'

function copyNoteRich(node){
  if(!node) return;
  const md=nodeAsMarkdown(node);
  const html=mdToHtml(md);
  const plain=md;
  if(navigator.clipboard && window.ClipboardItem){
    try{
      const htmlBlob=new Blob([html],{type:'text/html'});
      const textBlob=new Blob([plain],{type:'text/plain'});
      navigator.clipboard.write([new ClipboardItem({'text/html':htmlBlob,'text/plain':textBlob})])
        .then(()=>showToast('已复制（含文字 / 图片 / 格式，可直接粘贴到 Word、Notion）'))
        .catch(()=>fallbackCopyText(plain));
    }catch(e){ fallbackCopyText(plain); }
  } else { fallbackCopyText(plain); }
}
function fallbackCopyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(()=>showToast('已复制为纯文字')).catch(()=>showToast('复制失败：浏览器不支持')); }
  else { showToast('当前环境不支持剪贴板写入'); }
}

/* ============ Markdown ============ */
function mdToHtml(src){
  const lines = src.replace(/\r\n/g,'\n').split('\n');
  let html='', i=0, inCode=false, codeBuf=[], listType=null;
  const flushList=()=>{ if(listType){ html+= listType==='ul'?'</ul>':'</ol>'; listType=null; } };
  const inline=(t)=>{
    t = escapeHtml(t);
    t = t.replace(/`([^`]+)`/g,'<code>$1</code>');
    t = t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    t = t.replace(/\*([^*]+)\*/g,'<em>$1</em>');
    t = t.replace(/\[\[([^\]]+)\]\]/g,(m,name)=>{ const id=titleToId(name); const cls=id?'wikilink':'wikilink missing'; const act=id?`data-go="${id}"`:''; return `<span class="${cls}" ${act}>${escapeHtml(name)}</span>`; });
    t = t.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,(m,alt,url)=>{
      if(url.startsWith('asset://')){ const im=state.images[url.slice(8)]; return im ? `<img class="md-img" alt="${escapeHtml(alt)}" src="${im.dataURL}">` : `<span class="img-missing">[图片缺失: ${escapeHtml(alt)}]</span>`; }
      return `<img class="md-img" alt="${escapeHtml(alt)}" src="${escapeHtml(url)}">`;
    });
    t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    return t;
  };
  for(i=0;i<lines.length;i++){
    let line=lines[i];
    if(/^```/.test(line)){ if(!inCode){ inCode=true; codeBuf=[]; flushList(); } else { inCode=false; html+='<pre><code>'+escapeHtml(codeBuf.join('\n'))+'</code></pre>'; } continue; }
    if(inCode){ codeBuf.push(line); continue; }
    if(/^\s*$/.test(line)){ flushList(); continue; }
    if(/^\|.*\|$/.test(line) && i+1<lines.length && /^\|[\s:|-]+\|$/.test(lines[i+1])){
      flushList();
      const head=line.split('|').slice(1,-1).map(c=>c.trim());
      let j=i+2; const rows=[];
      while(j<lines.length && /^\|.*\|$/.test(lines[j])){ rows.push(lines[j].split('|').slice(1,-1).map(c=>c.trim())); j++; }
      let t='<table><thead><tr>'+head.map(h=>`<th>${inline(h)}</th>`).join('')+'</tr></thead><tbody>';
      rows.forEach(r=>{ t+='<tr>'+r.map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>'; });
      t+='</tbody></table>';
      html+=t; i=j-1; continue;
    }
    let m;
    if((m=line.match(/^(#{1,3})\s+(.*)$/))){ flushList(); const lv=m[1].length; html+=`<h${lv}>${inline(m[2])}</h${lv}>`; continue; }
    if(/^\s*>\s?/.test(line)){ flushList(); html+='<blockquote>'+inline(line.replace(/^\s*>\s?/,''))+'</blockquote>'; continue; }
    if(/^\s*([-*])\s+/.test(line)){ if(listType!=='ul'){ flushList(); html+='<ul>'; listType='ul'; } html+='<li>'+inline(line.replace(/^\s*([-*])\s+/,''))+'</li>'; continue; }
    if(/^\s*\d+\.\s+/.test(line)){ if(listType!=='ol'){ flushList(); html+='<ol>'; listType='ol'; } html+='<li>'+inline(line.replace(/^\s*\d+\.\s+/,''))+'</li>'; continue; }
    if(/^---+$/.test(line)){ flushList(); html+='<hr/>'; continue; }
    flushList(); html+='<p>'+inline(line)+'</p>';
  }
  if(inCode){ html+='<pre><code>'+escapeHtml(codeBuf.join('\n'))+'</code></pre>'; }
  flushList();
  return html;
}

function renderTree(){
  const root = document.getElementById('tree'); root.innerHTML='';
  if(state.filterTag){
    const b=document.createElement('div'); b.className='filter-banner';
    b.innerHTML=`<span>筛选标签：<b>${escapeHtml(state.filterTag)}</b> <i class="fcnt">${Object.values(state.nodes).filter(n=>n.tags.includes(state.filterTag)).length}</i></span><span class="fclear" title="清除筛选">✕ 清除</span>`;
    b.querySelector('.fclear').addEventListener('click',(e)=>{ e.stopPropagation(); state.filterTag=null; render(); });
    root.appendChild(b);
  }
  const build=(pid, container)=>{
    childrenOf(pid).forEach(n=>{
      if(!nodeMatchesFilter(n)) return;
      const row=document.createElement('div'); row.className='node-row'; row.dataset.id=n.id;
      if(n.id===state.selectedId) row.classList.add('selected');
      if(state.filterTag && n.tags.includes(state.filterTag)) row.classList.add('tag-hit');
      const kids=childrenOf(n.id);
      const tw=document.createElement('span'); tw.className='twist'+(kids.length?'':' leaf'); tw.textContent='▾';
      const label=document.createElement('span'); label.className='label'; label.textContent=n.title;
      const add=document.createElement('span'); add.className='row-add'; add.textContent='＋'; add.title='新建子节点';
      row.append(tw,label,add);
      row.addEventListener('click',(e)=>{ if(suppressClick){ suppressClick=false; return; } if(e.target===add) return; if(e.target===tw){ row.classList.toggle('collapsed'); const ch=row.nextElementSibling; if(ch&&ch.classList.contains('children')) ch.classList.toggle('hidden'); return; } selectNode(n.id); });
      add.addEventListener('click',(e)=>{ e.stopPropagation(); addChild(n.id); });
      row.addEventListener('contextmenu',(e)=>{ e.preventDefault(); openCtx(e, n.id); });
      // Pointer 拖拽：在行上按下并移动超过阈值即开始拖拽；点击（无移动）仍用于选中
      row.addEventListener('pointerdown',(e)=>{
        suppressClick=false;                              // 清除上一次可能残留的抑制标记
        if(e.target===add || e.target===tw) return;       // 控件点击不触发拖拽
        if(e.button!==0 && e.pointerType==='mouse') return; // 仅左键
        pdrag = { id: n.id, el: row, startX: e.clientX, startY: e.clientY, started: false, ghost: null, curTarget: null, curPos: 'into' };
      });
      container.appendChild(row);
      if(kids.length){ const ch=document.createElement('div'); ch.className='children'; build(n.id, ch); container.appendChild(ch); }
    });
  };
  build(null, root);
}

const BT=String.fromCharCode(96); // 反引号 `
function applyFormat(kind){
  const md=document.getElementById('md'); if(!md) return;
  if(md.style.display==='none'){ // 预览态 → 先切回编辑
    document.querySelectorAll('#edit-seg button').forEach(x=>x.classList.toggle('active', x.dataset.mode==='edit'));
    md.style.display='block'; const pv=document.getElementById('preview'); if(pv) pv.style.display='none';
  }
  md.focus();
  const v=md.value, s=md.selectionStart, e=md.selectionEnd, sel=v.slice(s,e);
  const lineStart=v.lastIndexOf('\n', s-1)+1;
  let lineEnd=v.indexOf('\n', e); if(lineEnd===-1) lineEnd=v.length;
  const cur=v.slice(lineStart, lineEnd);
  let out=v, ns=s, ne=e;
  if(kind==='h1'||kind==='h2'||kind==='h3'){
    const n=kind==='h1'?1:kind==='h2'?2:3;
    const body=cur.replace(/^#{1,6}\s?/,'').replace(/^\s+/,'');
    const prefixed='#'.repeat(n)+' '+body;
    out=v.slice(0,lineStart)+prefixed+v.slice(lineEnd); ns=lineStart; ne=lineStart+prefixed.length;
  } else if(kind==='bold'){
    if(sel){ out=v.slice(0,s)+'**'+sel+'**'+v.slice(e); ns=s+2; ne=e+2; } else { out=v.slice(0,s)+'****'+v.slice(e); ns=s+2; ne=s+2; }
  } else if(kind==='italic'){
    if(sel){ out=v.slice(0,s)+'*'+sel+'*'+v.slice(e); ns=s+1; ne=e+1; } else { out=v.slice(0,s)+'**'+v.slice(e); ns=s+1; ne=s+1; }
  } else if(kind==='code'){
    if(sel){ out=v.slice(0,s)+BT+sel+BT+v.slice(e); ns=s+1; ne=e+1; } else { out=v.slice(0,s)+BT+BT+v.slice(e); ns=s+1; ne=s+1; }
  } else if(kind==='ul'){
    const body=cur.replace(/^#{1,6}\s?/,'').replace(/^\d+\.\s/,'').replace(/^[-*]\s?/,'');
    const prefixed='- '+body;
    out=v.slice(0,lineStart)+prefixed+v.slice(lineEnd); ns=lineStart; ne=lineStart+prefixed.length;
  } else if(kind==='ol'){
    const body=cur.replace(/^#{1,6}\s?/,'').replace(/^[-*]\s?/,'').replace(/^\d+\.\s?/,'');
    const prefixed='1. '+body;
    out=v.slice(0,lineStart)+prefixed+v.slice(lineEnd); ns=lineStart; ne=lineStart+prefixed.length;
  } else if(kind==='link'){

// 把「单个元素自身」转成行内 Markdown（处理 img/strong/a 等；mdInline 只拼子节点，故需单独处理元素自身）
function inlineEl(el, idMap){
  const tag=el.tagName.toLowerCase();
  const inner=mdInline(el, idMap);
  if(/^h[1-6]$/.test(tag)) return '';                 // 标题是结构，内容抽取时忽略
  if(tag==='strong'||tag==='b') return '**'+inner+'**';
  if(tag==='em'||tag==='i') return '*'+inner+'*';
  if(tag==='code') return '`'+inner+'`';
  if(tag==='a'){
    let href=(el.getAttribute('href')||'').trim();
    if(href.charAt(0)==='#'){ const tgt=idMap && idMap[href.slice(1)]; if(tgt) return '[['+tgt+(inner.trim()?('|'+inner.trim()):'')+']]'; }
    return '['+inner+']('+href+')';
  }
  if(tag==='img') return '!['+(el.getAttribute('alt')||'')+']('+(el.getAttribute('src')||'')+')';
  if(tag==='br') return '\n';
  return inner;
}
function mdInline(node, idMap){
  let out='';
  node.childNodes.forEach(ch=>{ if(ch.nodeType===3) out+=ch.textContent; else if(ch.nodeType===1) out+=inlineEl(ch, idMap); });
  return out;
}
function mdTable(table, idMap){
  const rows=Array.from(table.querySelectorAll('tr')); if(!rows.length) return '';
  const cell=(tr)=>Array.from(tr.children).map(c=>mdInline(c,idMap).trim().replace(/\|/g,'\\|'));
  let md='| '+cell(rows[0]).join(' | ')+' |\n| '+Array(rows[0].children.length).fill('---').join(' | ')+' |\n';
  for(let i=1;i<rows.length;i++){ md+='| '+cell(rows[i]).join(' | ')+' |\n'; }
  return md.trim();
}
function mdBlock(node, idMap){
  if(node.nodeType===1){            // 叶子元素（未包在 p/figure 里，作块级兄弟）直接取其自身，避免图片/换行被吞
    const t=node.tagName.toLowerCase();
    if(t==='img') return inlineEl(node, idMap);
    if(t==='br') return '\n';
  }
  let out='';
  node.childNodes.forEach(ch=>{
    if(ch.nodeType===3){ const t=ch.textContent.replace(/\s+/g,' '); if(t.trim()) out+=t; }
    else if(ch.nodeType===1){
      const tag=ch.tagName.toLowerCase();
      if(/^h[1-6]$/.test(tag)){ out+='\n'+'#'.repeat(+tag[1])+' '+mdInline(ch,idMap).trim()+'\n\n'; }
      else if(tag==='p'){ out+='\n'+mdInline(ch,idMap).trim()+'\n\n'; }
      else if(tag==='ul'||tag==='ol'){ out+='\n'; Array.from(ch.querySelectorAll(':scope > li')).forEach((li,idx)=>{ out+=(tag==='ol'?(idx+1)+'. ':'- ')+mdInline(li,idMap).trim()+'\n'; }); out+='\n'; }
      else if(tag==='blockquote'){ out+='\n> '+mdInline(ch,idMap).trim().replace(/\n/g,'\n> ')+'\n\n'; }
      else if(tag==='pre'){ const code=ch.querySelector('code'); let lang=''; if(code){ const cls=code.getAttribute('class')||''; const m=/language-([\w+#.\-]+)/.exec(cls); if(m) lang=m[1]; } out+='\n```'+lang+'\n'+ch.textContent+'\n```\n\n'; }
      else if(tag==='hr'){ out+='\n---\n\n'; }
      else if(tag==='table'){ out+=mdTable(ch,idMap)+'\n\n'; }
      else { out+=inlineEl(ch, idMap); }   // 非块元素（img/span/行内）用 inlineEl 处理自身，避免图片/行内内容丢失
    }
  });
  return out;
}
function htmlToMarkdown(html, idMap){
  const doc=new DOMParser().parseFromString(html,'text/html');
  doc.querySelectorAll('script,style').forEach(e=>e.remove());
  return mdBlock(doc.body||doc.documentElement, idMap).replace(/\n{3,}/g,'\n\n').trim();
}
// 把正文里内联的 dataURL 图片抽出来存到 state.images，正文改为 asset:// 引用（避免编辑态显示一坨 base64「乱码」，且与「插入图片」一致）
function extractInlineImages(content){

    const id = 'imp_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);
    state.images[id] = { name: alt || 'image', dataURL: src };
    return '!['+alt+'](asset://'+id+')';
  });
}

// PDF 导入：逐页渲染成图片（保留版式/图片）+ 提取每页文本（可搜索），再整篇落库为一个笔记
async function pdfImport(buf, fileName){
  await loadPdfLib();
  const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
  const total=Math.min(pdf.numPages, 60);
  let md='';
  for(let p=1;p<=total;p++){
    const page=await pdf.getPage(p);
    const vp=page.getViewport({scale:1.5});
    const canvas=document.createElement('canvas');
    canvas.width=Math.ceil(vp.width); canvas.height=Math.ceil(vp.height);
    await page.render({ canvasContext:canvas.getContext('2d'), viewport:vp }).promise;
    const dataUrl=canvas.toDataURL('image/jpeg', 0.82);
    const id='pdf_'+Date.now().toString(36)+'_'+p+'_'+Math.random().toString(36).slice(2,5);
    state.images[id]={ name:(fileName||'PDF')+' 第'+p+'页', dataURL:dataUrl };
    md+='\n![第'+p+'页 / 共'+total+'页](asset://'+id+')\n\n';
    const content=await page.getTextContent();
    const txt=content.items.map(it=>it.str||'').join(' ').replace(/\s+/g,' ').trim();
    if(txt) md+='> '+txt+'\n\n';
  }
  return { title: fileName||'PDF 文档', level:0, children:[], content: md.trim(), anchor:null };
}
function importCreateNode(title, content, parentId){
  const id=uid(); state.nodes[id]={ id, title, parentId:parentId||null, tags:[], content }; return id;
}
// 把 HTML/Word 解析成「带层级的笔记大纲」：全局收集所有标题建树（兼容内容被 div/article 包裹的真实文档）+ 标题间兄弟内容 + 锚点 + 内部锚点链接
function parseHtmlOutline(rawHtml, fileName){
  const doc=new DOMParser().parseFromString(rawHtml,'text/html');
  doc.querySelectorAll('script,style,noscript').forEach(e=>e.remove());
  const idMap={};
  doc.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(h=>{ const id=h.getAttribute('id'); if(id) idMap[id]=(h.textContent||'').trim()||id; });
  const docTitleRaw=(doc.querySelector('title')?.textContent||'').trim();
  const firstH1=(doc.querySelector('h1')?.textContent||'').trim();
  const rootTitle=docTitleRaw||firstH1||fileName||'导入文档';
  const root={ title:rootTitle, level:0, children:[], content:'', anchor:null };
  const heads=[...doc.querySelectorAll('h1,h2,h3,h4,h5,h6')];
  const tidy=(n)=>{ n.content=n.content.replace(/[ \t]{2,}/g,' ').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim(); n.children.forEach(tidy); };
  if(!heads.length){ // 无标题：整篇作为一个节点（mdBlock 已能抓图片/行内）
    root.content=mdBlock(doc.body||doc.documentElement, idMap).replace(/\s+/g,' ').trim();
    tidy(root); return { root, idMap };
  }
  // 1) 按标题层级建树
  const stack=[root]; const secOf=new Map();
  heads.forEach(h=>{
    const level=+h.tagName[1];
    const title=(h.textContent||'').trim()||'（无标题）';
    const sec={ title, level, children:[], content:'', anchor: h.getAttribute('id')||null };
    while(stack.length>1 && stack[stack.length-1].level>=level) stack.pop();
    stack[stack.length-1].children.push(sec); stack.push(sec);
    secOf.set(h, sec);
    if(sec.anchor) idMap[sec.anchor]=title;
  });
  // 2) 收集每个标题的「后续兄弟内容」直到下一个标题（兼容标题与内容同属一个容器）
  heads.forEach((h, idx)=>{
    const sec=secOf.get(h); let sib=h.nextElementSibling; const nextHead=heads[idx+1]||null;
    while(sib && sib!==nextHead){ if(/^h[1-6]$/i.test(sib.tagName)) break; sec.content+=' '+mdBlock(sib, idMap); sib=sib.nextElementSibling; }
  });
  // 3) 首个标题之前的引导内容
  let pre=heads[0].previousElementSibling;
  while(pre){ if(/^h[1-6]$/i.test(pre.tagName)) break; root.content+=' '+mdBlock(pre, idMap); pre=pre.previousElementSibling; }
  tidy(root);
  // 避免与文档标题重复的首个 H1（自动作为根标题，不再单列节点）
  if(root.children.length && root.children[0].level===1 && root.children[0].title===root.title){
    const c=root.children.shift();
    root.content=(root.content+' '+c.content).trim();
    root.children=c.children.concat(root.children);
  }
  return { root, idMap };
}
function createNodesFromOutline(sec, parentId, counter){
  // 读取内容/图片/格式 → 落库为干净 Markdown：内联图抽为 asset:// 资源，残留 HTML 标签统一剔除
  let clean = extractInlineImages(sec.content || '');
  clean = clean.replace(/<[^>]+>/g, '').replace(/[ \t]{2,}/g,' ').replace(/\n{3,}/g,'\n\n').trim();
  const id = importCreateNode(sec.title, clean, parentId);
  if(sec.anchor) state.nodes[id].anchor = sec.anchor;
  if(counter) counter.n++;
  sec.children.forEach(c=> createNodesFromOutline(c, id, counter));
  return id;
}
function renderOutlinePreview(sec, depth){

function blobToDataURL(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(blob); }); }
// 把 Markdown 里的外链图片 fetch 下来转成 asset:// 本地资源，确保导入后图片真实可见
async function inlineExternalImages(md){
  const re=/!\[([^\]]*)\]\((https?:\/\/[^)\s]+)\)/g; const ms=[]; let m;
  while((m=re.exec(md))!==null){ if(!/^https?:\/\//.test(m[2])) continue; ms.push(m); }
  for(const mm of ms){ const full=mm[0], alt=mm[1], url=mm[2];
    try{ const resp=await fetch(url,{mode:'cors'}); if(!resp.ok) continue; const du=await blobToDataURL(await resp.blob());
      const id='imp_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6);
      state.images[id]={ name:alt||'image', dataURL:du };
      md=md.split(full).join('!['+alt+'](asset://'+id+')');
    }catch(e){ /* 跨域或离线则保留原外链，联网时仍能显示 */ }
  }
  return md;
}
async function inlineExternalImagesInOutline(sec){
  if(sec.content) sec.content=await inlineExternalImages(sec.content);
  for(const c of sec.children) await inlineExternalImagesInOutline(c);
}
async function importFiles(files){
  const items=[];
  for(const f of Array.from(files)){
    const ext=(f.name.split('.').pop()||'').toLowerCase();
    const baseTitle=f.name.replace(/\.[^.]+$/,'');
    try{
      if(ext==='html'||ext==='htm'){ const r=parseHtmlOutline(await readFileAsText(f), baseTitle); await inlineExternalImagesInOutline(r.root); items.push({ root:r.root, name:f.name }); }
      else if(ext==='docx'){ const r=parseHtmlOutline(await mammothToHtml(await f.arrayBuffer()), baseTitle); await inlineExternalImagesInOutline(r.root); items.push({ root:r.root, name:f.name }); }
      else if(ext==='pdf'){ const root=await pdfImport(await f.arrayBuffer(), baseTitle); items.push({ root, name:f.name }); }
      else { showToast('不支持的格式：'+f.name); continue; }
    }catch(err){ showToast('导入失败：'+f.name+'（'+(err&&err.message||err)+'）'); }
  }
  if(items.length) showImportPreview(items);
}

function pathOf(id){ const parts=[]; let n=getNode(id); while(n){ parts.unshift(n.title); n=getNode(n.parentId); } return parts.join(' / '); }

/* ============ CRUD ============ */
function selectNode(id){ state.selectedId=id; save(); render(); }
function addRoot(){ addChild(null); }
function addChild(parentId){
  const id=uid(); const base = parentId? '新建子节点' : '新建条目';
  let name=base, k=1; while(Object.values(state.nodes).some(n=>n.title===name && n.parentId===parentId)){ name=base+(++k); }
  const sibs=childrenOf(parentId);
  const maxOrder = sibs.length ? sibs[sibs.length-1].order || 0 : -1;
  state.nodes[id]={ id, title:name, parentId, tags:[], content:'', order: maxOrder+1 };
  state.selectedId=id; save(); render();
  // inline rename focus
  setTimeout(()=>{ const row=document.querySelector(`.node-row[data-id="${id}"] .label`); if(row){ startInlineRename(id, row); } },30);
}
function startInlineRename(id, labelEl){
  const cur=getNode(id).title; const inp=document.createElement('input'); inp.className='inline-input'; inp.value=cur;
  labelEl.replaceWith(inp); inp.focus(); inp.select();
  const commit=()=>{ const v=inp.value.trim(); if(v){ getNode(id).title=v; } else { if(!getNode(id).content && !getNode(id).tags.length && !childrenOf(id).length){ delete state.nodes[id]; if(state.selectedId===id) state.selectedId=null; } }
    save(); render(); };
  inp.addEventListener('blur',commit); inp.addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ inp.blur(); } if(e.key==='Escape'){ inp.value=cur; inp.blur(); } });
}
function renameNode(id){ const row=document.querySelector(`.node-row[data-id="${id}"]`); if(row){ const label=row.querySelector('.label'); startInlineRename(id, label); } }
function deleteNode(id){
  const node=getNode(id); const nchildren=childrenOf(id).length;
  const msg = nchildren? `「${node.title}」包含 ${nchildren} 个子节点，将一并移入回收站。` : `确定删除「${node.title}」？`;
  showModal('删除确认', msg, ()=>{
    const ids=[id, ...collectDesc(id)];
    // 删除前快照，供撤销完整恢复
    const snap=ids.map(i=>({ ...state.nodes[i] }));
    const title=getNode(id).title;
    ids.forEach(i=>delete state.nodes[i]);
    if(ids.includes(state.selectedId)) state.selectedId=null;
    state.lastDeleted={ snap, title };
    save(); render();
    showToast(`已移入回收站 · ${title}`, ()=>{ restoreLast(); });
  }, '删除', true);
}
function collectDesc(id){ let out=[]; childrenOf(id).forEach(c=>{ out.push(c.id); out=out.concat(collectDesc(c.id)); }); return out; }
function restoreLast(){ if(!state.lastDeleted) return; state.lastDeleted.snap.forEach(n=>{ state.nodes[n.id]={ ...n }; }); state.lastDeleted=null; save(); render(); }
function moveNode(id, newParent){
  if(id===newParent) return;
  let p=newParent; while(p){ if(p===id){ showToast('不能移动到自己的子级'); return; } p=getNode(p)?.parentId; }
  getNode(id).parentId=newParent; save(); render();
}

/* ============ 树拖拽（Pointer 事件实现，兼容 WKWebView） ============ */
function isDescendant(id, ancestor){ let p = getNode(id)?.parentId; while(p){ if(p===ancestor) return true; p = getNode(p)?.parentId; } return false; }
function clearDropHL(){ document.querySelectorAll('.node-row.drop-into, .node-row.drop-before, .node-row.drop-after, .node-row.drop-root').forEach(r=>r.classList.remove('drop-into','drop-before','drop-after','drop-root')); }
// 保证每个父级（含根）下的子节点拥有连续 0..n 的 order，便于排序与持久化
function normalizeOrders(){
  const parents = new Set([null]);
  Object.values(state.nodes).forEach(n=> parents.add(n.parentId));
  parents.forEach(pid=>{
    const sibs = childrenOf(pid);
    sibs.forEach((n,i)=>{ n.order = i; });
  });
}
// 拖拽落点：pos = 'before'（插到目标前/同级上方） | 'after'（插到目标后/同级下方） | 'into'（收为目标子节点）；targetId 为 null 表示移到根
function moveNodeRel(id, targetId, pos){
  const node = getNode(id); if(!node) return;
  if(targetId===null){ // 拖到空白区 → 移到根末尾
    node.parentId = null;
    const sibs = childrenOf(null).filter(n=>n.id!==id);
    node.order = (sibs.length ? sibs[sibs.length-1].order : -1) + 1;
    save(); renderTree(); return;
  }
  if(id===targetId) return;
  let p=targetId; while(p){ if(p===id){ showToast('不能移动到自己的子级'); return; } p=getNode(p)?.parentId; }
  const target = getNode(targetId); if(!target) return;
  const newParent = (pos==='into') ? targetId : target.parentId;
  node.parentId = newParent;
  const sibs = childrenOf(newParent).filter(n=>n.id!==id);
  let idx;
  if(pos==='into'){ idx = sibs.length; }
  else { const ti = sibs.findIndex(n=>n.id===targetId); idx = (ti<0) ? sibs.length : (pos==='before' ? ti : ti+1); }
  sibs.splice(idx, 0, node);
  sibs.forEach((n,i)=>{ n.order = i; });
  save(); renderTree();
}

/* ---- Pointer 拖拽状态机（鼠标 / 触控统一，不依赖原生 HTML5 DnD） ---- */
let pdrag = null;        // { id, el, startX, startY, started, ghost, curTarget, curPos }
let suppressClick = false;
const DRAG_THRESHOLD = 5;

function pdragFindTarget(y){
  const rows = [...document.querySelectorAll('.node-row')]
    .filter(r => r.dataset.id !== pdrag.id && !isDescendant(r.dataset.id, pdrag.id));
  for(const r of rows){
    const rect = r.getBoundingClientRect();
    if(y >= rect.top && y <= rect.bottom){
      const rel = (y - rect.top) / rect.height;
      return { row: r, pos: rel < 0.3 ? 'before' : (rel > 0.7 ? 'after' : 'into') };
    }
  }
  return null;
}
function pdragOnMove(e){
  if(!pdrag) return;
  if(!pdrag.started){
    const dx = e.clientX - pdrag.startX, dy = e.clientY - pdrag.startY;
    if(Math.hypot(dx, dy) < DRAG_THRESHOLD) return;
    pdrag.started = true;
    const g = document.createElement('div'); g.className = 'drag-ghost';
    g.textContent = getNode(pdrag.id)?.title || '';
    document.body.appendChild(g); pdrag.ghost = g;
    document.body.classList.add('dragging-active');
  }
  pdrag.ghost.style.left = e.clientX + 'px';
  pdrag.ghost.style.top = e.clientY + 'px';
  clearDropHL();
  const hit = pdragFindTarget(e.clientY);
  if(hit){
    hit.row.classList.add('drop-' + hit.pos);
    pdrag.curTarget = hit.row.dataset.id; pdrag.curPos = hit.pos;
  } else {
    pdrag.curTarget = null; pdrag.curPos = 'into';
    document.getElementById('tree').classList.add('drop-root');
  }
}
function pdragOnUp(){
  if(!pdrag) return;
  const d = pdrag; pdrag = null;
  if(d.started){
    if(d.ghost) d.ghost.remove();
    document.body.classList.remove('dragging-active');
    clearDropHL();
    if(d.curTarget){ moveNodeRel(d.id, d.curTarget, d.curPos); }
    else { moveNodeRel(d.id, null, 'into'); }
    suppressClick = true; // 本次指针操作是拖拽，阻止随后的 click 误触发选中
  }
}
function setupTreeDnD(){
  if(document.body.dataset.pdndReady) return; document.body.dataset.pdndReady = '1';
  document.addEventListener('pointermove', pdragOnMove, { passive: true });
  document.addEventListener('pointerup', pdragOnUp);
  document.addEventListener('pointercancel', pdragOnUp);
}

function removeTag(nodeId, tag){ const n=getNode(nodeId); n.tags=n.tags.filter(t=>t!==tag); save(); render(); }
function renameTag(oldT, newT){ newT=newT.trim(); if(!newT||newT===oldT) return; Object.values(state.nodes).forEach(n=>{ n.tags=n.tags.map(t=>t===oldT?newT:t); }); if(state.filterTag===oldT) state.filterTag=newT; save(); render(); }
function deleteTag(tag){ Object.values(state.nodes).forEach(n=>{ n.tags=n.tags.filter(t=>t!==tag); }); if(state.filterTag===tag) state.filterTag=null; save(); render(); }

/* ============ Save (debounced) ============ */
let saveTimer=null;
function debouncedSave(){ const s=document.getElementById('st-save'); s.textContent='编辑中…'; s.classList.remove('saved'); clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ save(); s.textContent='已保存 · 自动保存已开启'; s.classList.add('saved'); }, 800); }

/* ============ Graph (Ego / 聚焦星图) ============ */
const MAX_NEIGHBORS_HINT=40; // 邻居上限，防止单篇“枢纽笔记”连接爆炸导致卡顿
// 只取选中笔记的「一跳邻居」：出链 + 入链 + 同标签（保留原两类边语义），节点极少、静态布局、零物理模拟
function egoNeighbors(centerId, filter){
  const center=getNode(centerId); if(!center) return { center:null, neighbors:[], edges:[], truncated:false };
  const order={tag:0,out:1,in:2,both:3};
  const map={};
  const add=(id,kind)=>{ if(id===centerId||!getNode(id)) return; if(!map[id]){ map[id]={node:getNode(id),kind}; } else { const a=map[id].kind, b=kind; if(a!==b){ if((a==='out'&&b==='in')||(a==='in'&&b==='out')) map[id].kind='both'; else if(order[b]>order[a]) map[id].kind=b; } } };
  parseLinks(center.content).forEach(l=>{ const tid=titleToId(l); if(tid) add(tid,'out'); });
  backlinksOf(centerId).forEach(n=>add(n.id,'in'));
  const cset=new Set(center.tags);
  if(cset.size){ Object.values(state.nodes).forEach(n=>{ if(n.id===centerId||map[n.id]) return; if(n.tags.some(t=>cset.has(t))) add(n.id,'tag'); }); }
  let neighbors=Object.values(map);
  // 筛选：仅链接 / 仅标签（both 在两种筛选下都保留，因其同时含链接与标签）
  if(filter==='links'){ neighbors=neighbors.filter(nb=> nb.kind!=='tag'); }
  else if(filter==='tags'){ neighbors=neighbors.filter(nb=> nb.kind==='tag' || nb.kind==='both'); }
  // 邻居上限：超限按关系强度（both>in>out>tag）截断，防止单篇“枢纽笔记”连接爆炸导致卡顿
  const MAX_NEIGHBORS=MAX_NEIGHBORS_HINT; let truncated=false;
  if(neighbors.length>MAX_NEIGHBORS){
    const pri={ both:3, in:2, out:1, tag:0 };
    neighbors.sort((a,b)=> pri[b.kind]-pri[a.kind]);
    neighbors=neighbors.slice(0,MAX_NEIGHBORS);
    truncated=true;
  }
  const edges=neighbors.map(nb=>({ target:nb.node.id, kind:nb.kind }));
  return { center, neighbors, edges, truncated };
}

let egoDragId=null, egoDown=null, egoMoved=false, egoPos=null, egoWrap=null, egoRedraw=null, egoBound=false;

function renderGraph(){
  const wrap=document.getElementById('graph-wrap'); const host=document.getElementById('graph');
  if(!state.selectedId || !getNode(state.selectedId)){
    host.innerHTML='<div style="height:100%;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--text-mute);font-size:14px;line-height:1.8">在左侧或上方选择一篇笔记<br>即可查看它的关系星图</div>';
    const bl=document.getElementById('backlinks'); if(bl) bl.style.display='none';
    return;
  }
  const { center, neighbors, edges, truncated }=egoNeighbors(state.selectedId, state.graphFilter);
  // 筛选条：同步高亮 + 点击切换并整体重绘
  const fbar=document.getElementById('g-filter');
  if(fbar){ fbar.querySelectorAll('button').forEach(b=>{ b.classList.toggle('active', b.dataset.f===state.graphFilter); b.onclick=()=>{ state.graphFilter=b.dataset.f; renderGraph(); }; }); }
  const truncEl=document.getElementById('g-trunc');
  if(truncEl){ if(truncated){ truncEl.style.display='block'; truncEl.textContent=`邻居超过 ${MAX_NEIGHBORS_HINT} 个，已按关系强度（双向>入链>出链>标签）显示前 ${MAX_NEIGHBORS_HINT} 个`; } else { truncEl.style.display='none'; } }
  const W=wrap.clientWidth||800, H=wrap.clientHeight||500;
  const cx=W/2, cy=H/2, R=Math.min(W,H)*0.34;
  const pos={}; pos[center.id]={x:cx,y:cy};
  const N=Math.max(neighbors.length,1);
  neighbors.forEach((nb,i)=>{ const a=-Math.PI/2 + i/N*Math.PI*2; pos[nb.node.id]={ x:cx+Math.cos(a)*R, y:cy+Math.sin(a)*R }; });
  egoPos=pos; egoWrap=wrap;
  const svgNS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(svgNS,'svg'); svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const gE=document.createElementNS(svgNS,'g'), gN=document.createElementNS(svgNS,'g'); svg.append(gE,gN);
  const edgeEls=edges.map(e=>{ const l=document.createElementNS(svgNS,'line'); const tag=(e.kind==='tag'); l.setAttribute('stroke', tag?'var(--text-mute)':'var(--accent)'); l.setAttribute('stroke-width', tag?'1.5':'2.2'); if(tag) l.setAttribute('stroke-dasharray','5 5'); l.setAttribute('opacity','0.55'); gE.appendChild(l); return {l,e}; });
  const nodeEls=[];
  function mk(node,isCenter){
    const g=document.createElementNS(svgNS,'g');
    const r=isCenter?20:13;
    const c=document.createElementNS(svgNS,'circle'); c.setAttribute('r',r); c.setAttribute('fill', isCenter?'var(--accent)':'var(--accent-soft)'); c.setAttribute('stroke','var(--accent)'); c.setAttribute('stroke-width','2');
    const t=document.createElementNS(svgNS,'text'); t.setAttribute('text-anchor','middle'); t.setAttribute('dy', r+15); t.setAttribute('fill','var(--text)'); t.textContent=node.title;
    g.append(c,t); gN.appendChild(g);
    const ent={g,c,t,id:node.id,r};
    g.addEventListener('mousedown',(ev)=>{ egoDragId=ent.id; egoDown={x:ev.clientX,y:ev.clientY}; egoMoved=false; ev.preventDefault(); ev.stopPropagation(); });
    g.addEventListener('mouseenter',()=>highlightGraph(ent.id));
    g.addEventListener('mouseleave',()=>highlightGraph(null));
    g.addEventListener('click',(ev)=>{ ev.stopPropagation(); if(!egoMoved) selectNodeGraph(ent.id); });
    nodeEls.push(ent); return ent;
  }
  mk(center,true); neighbors.forEach(nb=>mk(nb.node,false));
  host.innerHTML=''; host.appendChild(svg);
  function redraw(){ edgeEls.forEach(({l,e})=>{ const a=pos[center.id], b=pos[e.target]; l.setAttribute('x1',a.x); l.setAttribute('y1',a.y); l.setAttribute('x2',b.x); l.setAttribute('y2',b.y); }); nodeEls.forEach(ent=>{ ent.g.setAttribute('transform',`translate(${pos[ent.id].x},${pos[ent.id].y})`); }); }
  egoRedraw=redraw; redraw();
  // 全局只挂一次拖拽监听；无帧循环、无物理模拟，纯静态重绘，零卡顿
  if(!egoBound){
    window.addEventListener('mousemove',(e)=>{ if(!egoDragId||!egoPos||!egoWrap) return; const rect=egoWrap.getBoundingClientRect(); egoPos[egoDragId].x=e.clientX-rect.left; egoPos[egoDragId].y=e.clientY-rect.top; if(egoDown && Math.hypot(e.clientX-egoDown.x,e.clientY-egoDown.y)>4) egoMoved=true; if(egoRedraw) egoRedraw(); });
    window.addEventListener('mouseup',()=>{ egoDragId=null; });
    egoBound=true;
  }
  function highlightGraph(id){
    const bl=document.getElementById('backlinks');
    if(!id){ edgeEls.forEach(({l})=>l.setAttribute('opacity','0.55')); nodeEls.forEach(ent=>{ ent.c.setAttribute('opacity','1'); ent.t.setAttribute('opacity','1'); }); if(bl) bl.style.display='block'; return; }
    edgeEls.forEach(({l,e})=>{ l.setAttribute('opacity', e.target===id?'1':'0.12'); });
    nodeEls.forEach(ent=>{ const active=(ent.id===id||ent.id===center.id); ent.c.setAttribute('opacity',active?'1':'0.25'); ent.t.setAttribute('opacity',active?'1':'0.25'); });
  }
  // 反向链接面板（中心的入链）
  const bls=backlinksOf(center.id); const body=document.getElementById('bl-body');
  if(body) body.innerHTML = bls.length? bls.map(n=>`<div class="bl" data-go="${n.id}"><div class="t">${escapeHtml(n.title)}</div><div class="prev">${escapeHtml((n.content||'').replace(/[#*`\\[\]]/g,'').slice(0,40))}</div><div class="tags">${n.tags.map(t=>`<span class="chip" style="padding:1px 8px;font-size:11px">${escapeHtml(t)}</span>`).join(' ')}</div></div>`).join('') : '<div style="color:var(--text-mute);font-size:12px">暂无反向链接</div>';
  if(body) body.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>selectNodeGraph(el.dataset.go)));
  const bl=document.getElementById('backlinks'); if(bl) bl.style.display='block';
}
// 图谱内/反向链接跳转：切换中心并整体重绘星图
function selectNodeGraph(id){ if(state.selectedId===id) return; state.selectedId=id; save(); render(); }
/* ============ [[ ]] 链接联想 ============ */
let lp = { open:false, start:0, items:[], idx:0, ta:null };
function detectLinkQuery(ta){
  const v=ta.value, s=ta.selectionStart;
  const before=v.slice(0,s);
  const m=before.match(/\[\[([^\[\]\n]*)$/);
  if(!m) return null;
  const start=before.lastIndexOf('[[');
  return { start, query:m[1], caret:s };
}
function detectAndShowLink(ta){
  const info=detectLinkQuery(ta);
  if(info) showLinkPop(ta, info); else hideLinkPop();
}
function showLinkPop(ta, info){
  const q=info.query.trim().toLowerCase();
  const items=Object.values(state.nodes)
    .filter(n=> n.id!==state.selectedId && n.title.toLowerCase().includes(q))
    .slice(0, 8);
  lp.ta=ta; lp.start=info.start; lp.items=items; lp.idx=0;
  const pop=document.getElementById('link-pop');
  if(!items.length){ pop.style.display='none'; lp.open=false; return; }
  lp.open=true;
  paintLinkPop();
  const rect=ta.getBoundingClientRect();
  pop.style.left=Math.min(rect.left, window.innerWidth-260)+'px';
  pop.style.top=(rect.top+4)+'px';
  pop.style.display='block';
}
function paintLinkPop(){
  const pop=document.getElementById('link-pop');
  pop.innerHTML=lp.items.map((n,i)=>`<div class="pop-item ${i===lp.idx?'active':''}" data-i="${i}"><span>${escapeHtml(n.title)}</span><span class="lp-path">${escapeHtml(pathOf(n.id))}</span></div>`).join('');
  pop.querySelectorAll('[data-i]').forEach(el=>el.addEventListener('mousedown',(e)=>{ e.preventDefault(); applyLinkChoice(parseInt(el.dataset.i)); }));
}
function hideLinkPop(){ lp.open=false; const pop=document.getElementById('link-pop'); if(pop) pop.style.display='none'; }
function applyLinkChoice(i){
  const n=lp.items[i]; if(!n) return;
  const ta=lp.ta; const v=ta.value; const sel=ta.selectionStart;
  const insert='[['+n.title+']]';
  const out=v.slice(0, lp.start)+insert+v.slice(sel);
  ta.value=out; const caret=lp.start+insert.length;
  ta.setSelectionRange(caret, caret);
  const node=getNode(state.selectedId); if(node) node.content=out;
  debouncedSave();
  ta.focus();
  hideLinkPop();
}

/* ============ Search ============ */
document.getElementById('search-input').addEventListener('input',(e)=>{
  const q=e.target.value.trim().toLowerCase(); if(!q){ render(); return; }
  const hits=Object.values(state.nodes).filter(n=>n.title.toLowerCase().includes(q)||n.content.toLowerCase().includes(q)||n.tags.some(t=>t.toLowerCase().includes(q)));
  if(state.view!=='tree') setView('tree');
  const root=document.getElementById('tree'); root.innerHTML='';
  if(!hits.length){ root.innerHTML='<div class="tag-empty">无匹配结果</div>'; return; }
  hits.forEach(n=>{
    let snippet='';
    const ci=n.content.toLowerCase().indexOf(q);
    if(ci>=0){ const s=Math.max(0,ci-18), en=Math.min(n.content.length, ci+42); snippet=(s>0?'…':'')+n.content.slice(s,en).replace(/\n+/g,' ').replace(/\s+/g,' ')+(en<n.content.length?'…':''); }
    const row=document.createElement('div'); row.className='node-row'+(n.id===state.selectedId?' selected':'');
    row.innerHTML=`<span class="twist leaf"></span>`;
    const box=document.createElement('div'); box.style.cssText='flex:1;min-width:0;display:flex;flex-direction:column;gap:2px';
    box.innerHTML=`<span class="label" style="flex:none">${escapeHtml(n.title)}</span><span style="font-size:11px;color:var(--text-mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(snippet||pathOf(n.id))}</span>`;
    row.appendChild(box);
    row.addEventListener('click',()=>selectNode(n.id)); root.appendChild(row);
  });
});

/* ============ Top bar events ============ */
document.getElementById('add-root').addEventListener('click',addRoot);
document.getElementById('theme-btn').addEventListener('click',()=>{ state.theme = state.theme==='dark'?'light':'dark'; applyTheme(); save(); });
document.getElementById('reveal-btn').addEventListener('click',()=>{
  if(HAS_TAURI){ invoke('reveal_vault').catch(e=>console.error('reveal_vault failed', e)); }
  else { showToast('网页版数据已存于当前浏览器本地（localStorage）。桌面版可在访达打开文件夹。'); }
});
window.addEventListener('keydown',(e)=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); document.getElementById('search-input').focus(); } });

/* ============ 安装包下载徽标（顶部左边 · 显示最新版本号） ============ */
const PKG_REPO = 'TIANCAIZXT/pyrakb-app';
function pkgDetectPlatform(){
  const ua = navigator.userAgent || '';
  if(/Mac|iPhone|iPad|Darwin/.test(ua)) return 'macos';
  if(/Win/.test(ua)) return 'windows';
  return 'linux';
}
function pkgPlatformExt(p){ return p==='macos' ? '.dmg' : p==='windows' ? '.msi' : '.deb'; }
async function initDownloadBadge(){
  const badge = document.getElementById('dl-badge');
  if(!badge) return;
  const plat = pkgDetectPlatform();
  const ext = pkgPlatformExt(plat);
  const fallback = `https://github.com/${PKG_REPO}/releases/latest`;
  badge.href = fallback;
  try{
    const res = await fetch(`https://api.github.com/repos/${PKG_REPO}/releases/latest`, { headers: { 'Accept': 'application/vnd.github+json' } });
    if(!res.ok) throw new Error('http '+res.status);
    const data = await res.json();
    const tag = (data.tag_name || '').replace(/^v/i, '');
    const asset = (data.assets || []).find(a => a.name && a.name.toLowerCase().endsWith(ext));
    const url = asset ? asset.browser_download_url : fallback;
    badge.href = url;
    let label = `安装包 v${tag || '?'} ↓`;
    let cur = null;
    if(HAS_TAURI && window.__TAURI__ && window.__TAURI__.app && window.__TAURI__.app.getVersion){
      try{ cur = await window.__TAURI__.app.getVersion(); }catch(e){}
    }
    if(cur && tag && cur !== tag){ label = `可更新 v${tag} ↓`; badge.classList.add('update'); }
    const verEl = badge.querySelector('.ver'); if(verEl) verEl.textContent = label;
  }catch(e){
    const verEl = badge.querySelector('.ver'); if(verEl) verEl.textContent = '安装包 ↓';
    badge.href = fallback;
  }
  badge.addEventListener('click', (e)=>{
    const url = badge.href;
    if(HAS_TAURI && window.__TAURI__ && window.__TAURI__.shell && window.__TAURI__.shell.open){
      e.preventDefault(); try{ window.__TAURI__.shell.open(url); }catch(_){ window.open(url, '_blank'); }
    }
  });
}

/* ============ Boot ============ */
(async function(){
  await waitTauri();          // 等 Tauri 运行时注入完成，确保 invoke 可用
  HAS_TAURI = TAURI_OK();
  if(!HAS_TAURI){ // 网页版：隐藏「在访达打开」按钮并标注版本
    const rb=document.getElementById('reveal-btn'); if(rb) rb.style.display='none';
    const sub=document.querySelector('.brand .sub'); if(sub) sub.textContent='桌面版 · 原型演示';
  }
  if(!(await apiLoad())){ seed(); save(); }
  normalizeOrders(); save();
  applyTheme(); setView('tree'); render(); setupTreeDnD(); setupImportPreview();
  registerClipListener();
  if(!HAS_TAURI){ showToast('网页版：笔记存于当前浏览器本地存储；换设备或清缓存会丢失，重要资料建议安装桌面版。'); }
  initDownloadBadge();
})();
</script>
