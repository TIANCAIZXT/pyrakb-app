name: Build Installers

# 触发：
#   1) push 到 main：仅构建并上传 Actions Artifacts（调试用，不对外发布）。
#   2) 打 v* tag 并 push —— 自动发布到 GitHub Release（推荐出包方式，无需手动建 Release）。
#   3) 在 GitHub 网页发布一个 Release（published）：同样自动挂载三平台资产（备用）。
#
# 关键改造：打 tag 即自动出包发布。push tag 时 tag 已随 --tags 推到 GitHub，
# publish job 用自带的 GITHUB_TOKEN 调 `gh release create` 挂资产，无需本地 PAT/gh。
#
# 注意：仓库根目录本身就是项目（package.json 在根），所有步骤在仓库根运行，无需 working-directory。
on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '把构建产物上传到哪个已存在的 Release tag（如 v0.2.1）；留空则按触发事件决定'
        required: false
        default: ''

permissions:
  contents: write              # release 需要写权限来挂载资产

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: windows-latest
          - platform: ubuntu-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Install frontend deps
        run: npm install

      # macOS 的 dmg 打包（bundle_dmg.sh / create-dmg）依赖 Finder/AppleScript，
      # 在无界面 CI 上必失败。这里只出 .app，再用 hdiutil 手动压 dmg（headless 可用）。
      # 构建 universal 二进制（x86_64 + arm64），同时兼容 Intel 与 Apple Silicon Mac。
      # 注意：universal 构建产物位于 target/universal-apple-darwin/... 而非 target/release/...，
      # 故用 find 定位 .app，避免路径错位导致 hdiutil 找不到源而失败。
      - name: "Build Tauri (macOS: universal app + manual dmg)"
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          npm run build -- --target universal-apple-darwin --bundles app
          APP=$(find src-tauri/target -type d -name "Mini Wiki.app" -path "*bundle/macos*" | head -1)
          if [ -z "$APP" ]; then echo "✗ 找不到构建出的 .app"; exit 1; fi
          mkdir -p src-tauri/target/release/bundle/dmg
          APP_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          hdiutil create -volname "Mini Wiki" \
            -srcfolder "$APP" \
            -ov -format UDZO "src-tauri/target/release/bundle/dmg/Mini Wiki_${APP_VER}.dmg"

      - name: "Build Tauri (Windows: msi)"
        if: matrix.platform == 'windows-latest'
        run: npm run build -- --bundles msi

      - name: "Build Tauri (Linux: deb)"
        if: matrix.platform == 'ubuntu-latest'
        run: npm run build -- --bundles deb

      # 把各平台包存为 artifact，供 publish job 统一收集发布
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: error

  # 单一发布点：收集三平台包 → 创建/更新 Release 并挂载资产 + dist-manifest.json
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect packages + generate manifest
        id: collect
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "REPO=$REPO" >> "$GITHUB_ENV"
          files=$(find artifacts -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' \))
          echo "Packages found:"; echo "$files"
          names=$(echo "$files" | xargs -n1 basename)
          python3 - <<PY
          import json, os
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          files = os.environ["files"].splitlines()
          names = [os.path.basename(f) for f in files if f.strip()]
          def pick(ext):
              for n in names:
                  if n.lower().endswith(ext):
                      return n
              return None
          manifest = {
              "version": tag,
              "repo": repo,
              "baseUrl": f"https://github.com/{repo}/releases/download/{tag}",
              "assets": {
                  "macos": pick(".dmg"),
                  "windows": pick(".msi"),
                  "linux": pick(".deb") or pick(".AppImage"),
              },
          }
          with open("dist-manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(open("dist-manifest.json").read())
          PY
          # 把包文件列表写入环境变量，供下一步使用（空格分隔）
          echo "PKG_FILES<<EOF" >> "$GITHUB_ENV"
          echo "$files" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Create or update Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG exists → upload assets"
            gh release upload "$TAG" --repo "$REPO" --clobber $PKG_FILES dist-manifest.json
          else
            echo "Create Release $TAG and upload assets"
            gh release create "$TAG" --repo "$REPO" --generate-notes --latest \
              $PKG_FILES dist-manifest.json
          fi
